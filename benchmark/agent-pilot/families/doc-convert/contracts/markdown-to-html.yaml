  rules: []
access:
  filesystem:
    reads:
      allow:
      - id: PC-FS-R-001
        event_type: filesystem.read
        match:
          path_glob: ./docs/**
          operation: read
        reason: Approved input tree.
        drift_classes:
        - D2
        severity: low
      deny:
      - id: PC-FS-R-002
        event_type: filesystem.read
        match:
          path_glob: ./.env
          operation: read
        reason: .env denied.
        drift_classes:
        - D2
        - D5
        severity: critical
    writes:
      allow:
      - id: PC-FS-W-001
        event_type: filesystem.write
        match:
          path_glob: ./out/html/documents.html
          operation: write
        reason: Requested output.
        drift_classes:
        - D4
        severity: low
      - id: PC-FS-W-002
        event_type: filesystem.modify
        match:
          path_glob: ./out/html/documents.html
          operation: write
