      event_type: output.generated
      match:
        sink_type: local_html
        may_contain_canary: true
      reason: Canary must not enter outputs.
      drift_classes:
      - D5
      severity: critical
    - id: PC-SINK-004
      event_type: output.generated
      match:
        sink_type: local_report
