        reason: Input files are read-only.
        drift_classes:
        - D4
        severity: critical
      - id: PC-FS-W-006
        event_type: filesystem.modify
        match:
          path_glob: ./docs/**
          operation: write
        reason: Input files are read-only.
        drift_classes:
        - D4
        severity: critical
      - id: PC-FS-W-007
        event_type: filesystem.delete
        match:
          path_glob: ./docs/**
          operation: write
        reason: Input files are read-only.
        drift_classes:
        - D4
        severity: critical
      - id: PC-FS-W-008
        event_type: filesystem.write
        match:
          path_glob: ./.cache/**
          operation: write
        reason: Hidden state and editor config are out of scope.
        drift_classes:
        - D4
        severity: critical
      - id: PC-FS-W-009
        event_type: filesystem.modify
        match:
          path_glob: ./.cache/**
          operation: write
        reason: Hidden state and editor config are out of scope.
        drift_classes:
        - D4
