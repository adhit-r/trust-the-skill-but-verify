<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="600" viewBox="0 0 1160 600" role="img" aria-labelledby="title desc">
  <title id="title">SkillDiff architecture</title>
  <desc id="desc">The architecture holds skill, task, contract, workspace, prompt, variant, and repeat identity fixed while varying runtime profile, then normalizes traces, checks contracts, compares runtime pairs, and emits bounded reports and claim-ledger evidence.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <style>
      .title { font: 700 24px Arial, sans-serif; fill: #111827; }
      .label { font: 700 15px Arial, sans-serif; fill: #111827; }
      .small { font: 13px Arial, sans-serif; fill: #374151; }
      .tiny { font: 12px Arial, sans-serif; fill: #4b5563; }
      .panel { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; rx: 8; }
      .fixed { fill: #ecfeff; stroke: #0f766e; stroke-width: 1.5; rx: 8; }
      .runtime { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; rx: 8; }
      .evidence { fill: #fff7ed; stroke: #b45309; stroke-width: 1.5; rx: 8; }
      .output { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.5; rx: 8; }
      .boundary { fill: #f9fafb; stroke: #6b7280; stroke-width: 1.2; rx: 8; }
      .arrow { stroke: #1f2937; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #6b7280; stroke-width: 1.2; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1160" height="600" fill="#ffffff"/>
  <text x="42" y="46" class="title">SkillDiff Architecture</text>
  <text x="42" y="72" class="small">Fixed skill-task-contract unit, varied runtime profile, bounded evidence outputs.</text>

  <rect x="34" y="104" width="258" height="382" class="panel"/>
  <text x="58" y="134" class="label">Fixed invariant</text>
  <rect x="58" y="156" width="210" height="46" class="fixed"/>
  <text x="78" y="184" class="small">Skill artifact</text>
  <rect x="58" y="214" width="210" height="46" class="fixed"/>
  <text x="78" y="242" class="small">Task and prompt hash</text>
  <rect x="58" y="272" width="210" height="46" class="fixed"/>
  <text x="78" y="300" class="small">Security contract</text>
  <rect x="58" y="330" width="210" height="46" class="fixed"/>
  <text x="78" y="358" class="small">Workspace snapshot</text>
  <rect x="58" y="388" width="210" height="46" class="fixed"/>
  <text x="78" y="416" class="small">Variant and repeat ID</text>
  <text x="58" y="462" class="tiny">Held constant for each pairwise comparison.</text>

  <rect x="338" y="104" width="218" height="382" class="panel"/>
  <text x="362" y="134" class="label">Runtime variable</text>
  <rect x="362" y="158" width="170" height="58" class="runtime"/>
  <text x="386" y="185" class="label">RP2</text>
  <text x="386" y="205" class="small">Local controlled fixture</text>
  <rect x="362" y="236" width="170" height="58" class="runtime"/>
  <text x="386" y="263" class="label">RP3</text>
  <text x="386" y="283" class="small">Docker-backed fixture</text>
  <rect x="362" y="314" width="170" height="58" class="runtime"/>
  <text x="386" y="341" class="label">RP1 / RP5</text>
  <text x="386" y="361" class="small">Simulator / fixture</text>
  <rect x="362" y="392" width="170" height="58" class="runtime"/>
  <text x="386" y="419" class="label">RP6</text>
  <text x="386" y="439" class="small">Report-card pilot</text>

  <rect x="612" y="126" width="192" height="76" class="evidence"/>
  <text x="640" y="155" class="label">Adapter runner</text>
  <text x="640" y="176" class="small">Prepare, execute, clean</text>
  <rect x="612" y="258" width="192" height="76" class="evidence"/>
  <text x="640" y="287" class="label">Raw evidence</text>
  <text x="640" y="308" class="small">Files, process, network</text>
  <rect x="612" y="390" width="192" height="76" class="evidence"/>
  <text x="640" y="419" class="label">Normalized trace</text>
  <text x="640" y="440" class="small">Canonical event stream</text>

  <rect x="866" y="126" width="220" height="76" class="output"/>
  <text x="894" y="155" class="label">Contract checker</text>
  <text x="894" y="176" class="small">Violation and output labels</text>
  <rect x="866" y="258" width="220" height="76" class="output"/>
  <text x="894" y="287" class="label">Pairwise comparator</text>
  <text x="894" y="308" class="small">Runtime disagreement signals</text>
  <rect x="866" y="390" width="220" height="76" class="output"/>
  <text x="894" y="419" class="label">Reports and ledger</text>
  <text x="894" y="440" class="small">Bounded paper evidence</text>

  <path class="arrow" d="M 292 296 L 336 296"/>
  <path class="arrow" d="M 556 296 C 586 296 586 164 610 164"/>
  <path class="arrow" d="M 708 202 L 708 254"/>
  <path class="arrow" d="M 708 334 L 708 386"/>
  <path class="arrow" d="M 804 428 C 838 428 838 164 864 164"/>
  <path class="arrow" d="M 976 202 L 976 254"/>
  <path class="arrow" d="M 976 334 L 976 386"/>
  <path class="dash" d="M 804 296 L 864 296"/>

  <rect x="46" y="524" width="1068" height="44" class="boundary"/>
  <text x="66" y="552" class="small">Boundary: simulator, fixture, report-card, repeat, machine-only interval, and review-ready evidence remain labeled separately from current RP2/RP3 executable drift evidence.</text>
</svg>
