<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="520" viewBox="0 0 1160 520" role="img" aria-labelledby="title desc">
  <title id="title">Artifact flow</title>
  <desc id="desc">Artifact release flow from tracked benchmark definitions through generated results, claim ledger, verification, anonymity checks, and release bundle, with raw scratch and human review kept outside claim boundaries until completed.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <style>
      .title { font: 700 24px Arial, sans-serif; fill: #111827; }
      .label { font: 700 15px Arial, sans-serif; fill: #111827; }
      .small { font: 13px Arial, sans-serif; fill: #374151; }
      .tiny { font: 12px Arial, sans-serif; fill: #4b5563; }
      .box { fill: #f8fafc; stroke: #1f2937; stroke-width: 1.5; rx: 8; }
      .tracked { fill: #ecfeff; stroke: #0f766e; }
      .generated { fill: #eff6ff; stroke: #2563eb; }
      .release { fill: #f0fdf4; stroke: #15803d; }
      .hold { fill: #fff7ed; stroke: #b45309; }
      .arrow { stroke: #1f2937; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #6b7280; stroke-width: 1.3; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="0" y="0" width="1160" height="520" fill="#ffffff"/>
  <text x="42" y="46" class="title">Artifact Flow</text>
  <text x="42" y="72" class="small">Release hygiene keeps evidence reproducible while preserving safety and anonymity boundaries.</text>

  <rect x="54" y="126" width="186" height="92" class="box tracked"/>
  <text x="84" y="158" class="label">Tracked inputs</text>
  <text x="84" y="182" class="small">Manifests, contracts</text>
  <text x="84" y="202" class="small">Tasks, expected outputs</text>

  <rect x="292" y="126" width="186" height="92" class="box generated"/>
  <text x="322" y="158" class="label">Generated evidence</text>
  <text x="322" y="182" class="small">Traces, findings</text>
  <text x="322" y="202" class="small">Comparisons, reports</text>

  <rect x="530" y="126" width="186" height="92" class="box generated"/>
  <text x="560" y="158" class="label">Claim ledger</text>
  <text x="560" y="182" class="small">Every number maps</text>
  <text x="560" y="202" class="small">to checked evidence</text>

  <rect x="768" y="126" width="186" height="92" class="box release"/>
  <text x="798" y="158" class="label">Verification gate</text>
  <text x="798" y="182" class="small">Schemas, traces</text>
  <text x="798" y="202" class="small">Ledger, path hygiene</text>

  <rect x="530" y="304" width="186" height="92" class="box release"/>
  <text x="560" y="336" class="label">Clean bundle</text>
  <text x="560" y="360" class="small">Anonymity checklist</text>
  <text x="560" y="380" class="small">One-command repro path</text>

  <rect x="292" y="304" width="186" height="92" class="box hold"/>
  <text x="322" y="336" class="label">Held out</text>
  <text x="322" y="360" class="small">Raw scratch stdout/stderr</text>
  <text x="322" y="380" class="small">Local-only workspaces</text>

  <rect x="768" y="304" width="186" height="92" class="box hold"/>
  <text x="798" y="336" class="label">Review scaffold</text>
  <text x="798" y="360" class="small">Queues and blank forms</text>
  <text x="798" y="380" class="small">0 completed reviewer labels</text>

  <path class="arrow" d="M 240 172 L 290 172"/>
  <path class="arrow" d="M 478 172 L 528 172"/>
  <path class="arrow" d="M 716 172 L 766 172"/>
  <path class="arrow" d="M 861 218 C 846 266 760 320 718 340"/>
  <path class="dash" d="M 385 218 L 385 302"/>
  <path class="dash" d="M 861 218 L 861 302"/>
  <text x="64" y="462" class="tiny">Release claim boundary: no real secrets, cookies, auth state, public-network exfiltration evidence, completed human review, or reviewer agreement unless direct artifacts exist.</text>
</svg>
