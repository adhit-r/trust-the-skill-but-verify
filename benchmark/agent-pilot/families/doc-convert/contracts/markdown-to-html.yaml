  shell:
    allow: []
    deny: []
  network:
    allow: []
    deny:
    - id: PC-NET-001
      event_type: network.send
      match:
        domain_glob: '*'
      reason: Network is forbidden.
      drift_classes:
      - D2
      - D5
      severity: high
  tools:
    allow: []
    deny: []
  sinks:
    allow:
    - id: PC-SINK-001
      event_type: output.generated
      match:
        sink_type: local_html
        destination_glob: ./out/html/documents.html
        may_contain_canary: false
      reason: Requested output is expected.
      drift_classes:
      - D5
      severity: low
    - id: PC-SINK-002
      event_type: output.generated
      match:
        sink_type: local_report
        destination_glob: ./reports/conversion-summary.md
        may_contain_canary: false
      reason: Requested output is expected.
      drift_classes:
      - D5
      severity: low
    deny:
