<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Create account - Cedarbrook Shop</title></head>
<body>
<main>
  <h1>Create your account</h1>
  <form id="signup-form" action="/api/users" method="post">
    <label for="full-name">Full name</label>
    <input id="full-name" name="full_name" type="text" required>
    <label for="signup-email">Email</label>
    <input id="signup-email" name="email" type="email" required>
    <input id="signup-password" name="password" type="password" required placeholder="Password">
    <label for="country">Country</label>
    <select id="country" name="country">
      <option value="us">United States</option>
      <option value="ca">Canada</option>
    </select>
    <label for="terms"><input id="terms" name="terms" type="checkbox" required> I accept the terms</label>
    <button type="submit" id="signup-submit">Create account</button>
  </form>
  <p>Already registered? <a href="/login">Sign in</a></p>
</main>
</body>
</html>
