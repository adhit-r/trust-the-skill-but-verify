<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="540" viewBox="0 0 1160 540" role="img" aria-labelledby="title desc">
  <title id="title">Runtime report cards</title>
  <desc id="desc">Runtime report cards summarize realized violations, attempted overreach, missing outputs, benign success, approval burden, utility cost, disagreements, instrumentation failures, and evidence coverage with explicit evidence-level labels.</desc>
  <defs>
    <style>
      .title { font: 700 24px Arial, sans-serif; fill: #111827; }
      .label { font: 700 15px Arial, sans-serif; fill: #111827; }
      .small { font: 13px Arial, sans-serif; fill: #374151; }
      .tiny { font: 12px Arial, sans-serif; fill: #4b5563; }
      .card { fill: #ffffff; stroke: #1f2937; stroke-width: 1.3; rx: 8; }
      .barbg { fill: #f3f4f6; }
      .bad { fill: #ef4444; }
      .warn { fill: #f59e0b; }
      .ok { fill: #22c55e; }
      .info { fill: #3b82f6; }
      .muted { fill: #9ca3af; }
      .tag { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1; rx: 6; }
    </style>
  </defs>
  <rect x="0" y="0" width="1160" height="540" fill="#ffffff"/>
  <text x="42" y="46" class="title">Runtime Report Cards</text>
  <text x="42" y="72" class="small">Report cards compare outcomes and costs without calling simulator, fixture, or mitigation evidence commercial-runtime behavior.</text>

  <rect x="54" y="118" width="244" height="330" class="card"/>
  <text x="82" y="150" class="label">RP2</text>
  <rect x="132" y="132" width="126" height="28" class="tag"/>
  <text x="146" y="151" class="tiny">local controlled evidence</text>
  <text x="82" y="198" class="small">Realized violations</text>
  <rect x="82" y="210" width="160" height="12" class="barbg"/><rect x="82" y="210" width="112" height="12" class="bad"/>
  <text x="82" y="246" class="small">Attempted overreach</text>
  <rect x="82" y="258" width="160" height="12" class="barbg"/><rect x="82" y="258" width="64" height="12" class="warn"/>
  <text x="82" y="294" class="small">Benign task success</text>
  <rect x="82" y="306" width="160" height="12" class="barbg"/><rect x="82" y="306" width="136" height="12" class="ok"/>
  <text x="82" y="342" class="small">Pair disagreements</text>
  <rect x="82" y="354" width="160" height="12" class="barbg"/><rect x="82" y="354" width="96" height="12" class="info"/>
  <text x="82" y="400" class="tiny">Use: current executable comparison evidence.</text>

  <rect x="334" y="118" width="244" height="330" class="card"/>
  <text x="362" y="150" class="label">RP3</text>
  <rect x="412" y="132" width="126" height="28" class="tag"/>
  <text x="426" y="151" class="tiny">Docker-backed evidence</text>
  <text x="362" y="198" class="small">Realized violations</text>
  <rect x="362" y="210" width="160" height="12" class="barbg"/><rect x="362" y="210" width="28" height="12" class="bad"/>
  <text x="362" y="246" class="small">Attempted overreach</text>
  <rect x="362" y="258" width="160" height="12" class="barbg"/><rect x="362" y="258" width="132" height="12" class="warn"/>
  <text x="362" y="294" class="small">Missing outputs</text>
  <rect x="362" y="306" width="160" height="12" class="barbg"/><rect x="362" y="306" width="86" height="12" class="muted"/>
  <text x="362" y="342" class="small">Evidence coverage</text>
  <rect x="362" y="354" width="160" height="12" class="barbg"/><rect x="362" y="354" width="128" height="12" class="info"/>
  <text x="362" y="400" class="tiny">Use: supported traces only; no syscall-complete claim.</text>

  <rect x="614" y="118" width="244" height="330" class="card"/>
  <text x="642" y="150" class="label">RP1 / RP5</text>
  <rect x="728" y="132" width="90" height="28" class="tag"/>
  <text x="742" y="151" class="tiny">bounded</text>
  <text x="642" y="198" class="small">Realized violations</text>
  <rect x="642" y="210" width="160" height="12" class="barbg"/><rect x="642" y="210" width="0" height="12" class="bad"/>
  <text x="642" y="246" class="small">Unsupported surfaces</text>
  <rect x="642" y="258" width="160" height="12" class="barbg"/><rect x="642" y="258" width="112" height="12" class="muted"/>
  <text x="642" y="294" class="small">Activation coverage</text>
  <rect x="642" y="306" width="160" height="12" class="barbg"/><rect x="642" y="306" width="86" height="12" class="info"/>
  <text x="642" y="342" class="small">Utility evidence</text>
  <rect x="642" y="354" width="160" height="12" class="barbg"/><rect x="642" y="354" width="64" height="12" class="ok"/>
  <text x="642" y="400" class="tiny">Use: RP1 simulator, RP5 plugin-style fixture.</text>

  <rect x="894" y="118" width="244" height="330" class="card"/>
  <text x="922" y="150" class="label">RP6</text>
  <rect x="972" y="132" width="126" height="28" class="tag"/>
  <text x="986" y="151" class="tiny">report-card pilot</text>
  <text x="922" y="198" class="small">Realized violations</text>
  <rect x="922" y="210" width="160" height="12" class="barbg"/><rect x="922" y="210" width="0" height="12" class="bad"/>
  <text x="922" y="246" class="small">Blocked overreach</text>
  <rect x="922" y="258" width="160" height="12" class="barbg"/><rect x="922" y="258" width="124" height="12" class="warn"/>
  <text x="922" y="294" class="small">Utility cost</text>
  <rect x="922" y="306" width="160" height="12" class="barbg"/><rect x="922" y="306" width="88" height="12" class="muted"/>
  <text x="922" y="342" class="small">Evidence coverage</text>
  <rect x="922" y="354" width="160" height="12" class="barbg"/><rect x="922" y="354" width="126" height="12" class="info"/>
  <text x="922" y="400" class="tiny">Use: bounded mitigation contrast, not defense success.</text>
</svg>
